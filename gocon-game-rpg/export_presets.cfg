[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter="data/*.json,data/maps/*.json"
exclude_filter="addons/*,tests/*,assets/dialog_preview.png,assets/frames_preview.png"
export_path="../builds/windows/GoconGame.exe"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter="data/*.json,data/maps/*.json"
exclude_filter="addons/*,tests/*,assets/dialog_preview.png,assets/frames_preview.png"
export_path="../builds/web/index.html"
script_export_mode=2

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.2]
name="Web Validation"
platform="Web"
runnable=false
custom_features="migration_validation"
advanced_options=false
export_filter="all_resources"
include_filter="data/*.json,data/maps/*.json"
exclude_filter="addons/*,assets/dialog_preview.png,assets/frames_preview.png"
export_path="../builds/web-validation/index.html"
script_export_mode=2

[preset.2.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
